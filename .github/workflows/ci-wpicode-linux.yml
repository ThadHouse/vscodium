name: CI - WPICode Linux archives

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "2027"
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

concurrency:
  group: wpicode-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  APP_NAME: WPICode 2027
  ARCHIVE_NAME: WPICode-2027
  BINARY_NAME: wpicode-2027
  CI_BUILD: yes
  DISABLE_UPDATE: yes
  GH_REPO_PATH: ${{ github.repository }}
  GITHUB_BRANCH: ${{ github.event.pull_request.head.sha || github.sha }}
  ORG_NAME: WPILib
  OS_NAME: linux
  PRODUCT_NAME: WPICode 2027
  SHOULD_BUILD_APPIMAGE: no
  SHOULD_BUILD_CLI: no
  SHOULD_BUILD_DEB: no
  SHOULD_BUILD_REH: no
  SHOULD_BUILD_REH_WEB: no
  SHOULD_BUILD_RPM: no
  SHOULD_BUILD_TAR: yes
  VSCODE_QUALITY: stable
  WPICODE_YEAR: "2027"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-22.04
    env:
      VSCODE_ARCH: x64
    outputs:
      BUILD_SOURCEVERSION: ${{ steps.versions.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ steps.versions.outputs.MS_COMMIT }}
      MS_TAG: ${{ steps.versions.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ steps.versions.outputs.RELEASE_VERSION }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          persist-credentials: false

      - name: Validate WPICode configuration
        run: ./test_wpicode.sh

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 10
          platform: x64

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install compile dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - name: Clone pinned VS Code source
        run: ./get_repo.sh

      - name: Compile shared source
        env:
          SHOULD_BUILD: yes
        run: ./build.sh

      - name: Capture build versions
        id: versions
        run: |
          echo "BUILD_SOURCEVERSION=${BUILD_SOURCEVERSION}" >> "${GITHUB_OUTPUT}"
          echo "MS_COMMIT=${MS_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "MS_TAG=${MS_TAG}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Compress shared source
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Upload shared source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpicode-linux-source
          path: vscode.tar.gz
          retention-days: 1

  archive:
    needs: compile
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_arch: x64
            npm_arch: x64
            image: vscodium/vscodium-linux-build-agent:focal-x64
          - vscode_arch: arm64
            npm_arch: arm64
            image: vscodium/vscodium-linux-build-agent:focal-arm64
    container:
      image: ${{ matrix.image }}
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ needs.compile.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.compile.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.compile.outputs.RELEASE_VERSION }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          persist-credentials: false

      - name: Install build dependencies
        run: ./build/linux/deps.sh

      - name: Download shared source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wpicode-linux-source

      - name: Build architecture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_bin.sh

      - name: Create and verify portable archive
        run: ./prepare_wpicode_assets.sh

      - name: Upload portable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WPICode-2027-linux-${{ matrix.vscode_arch }}
          path: assets/
          if-no-files-found: error
          retention-days: 7
